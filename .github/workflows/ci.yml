name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ocp, POSTGRES_PASSWORD: ocp, POSTGRES_DB: ocp }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ocp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_escalation.py
        env: { TEST_DATABASE_URL: "postgresql+asyncpg://ocp:ocp@localhost:5432/ocp" }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oncallpilot .
      - run: |
          docker run -d -p 8000:8000 --name app oncallpilot
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
